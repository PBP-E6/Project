<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Carbon Tracker{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                        display: ['League Spartan', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#31582B] text-gray-100 font-sans antialiased min-h-screen flex flex-col">
    <!-- Navigation Bar -->
    <nav class="bg-[#244220] text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold font-display tracking-tight">FoodCarbonTracker</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="#" class="hover:text-brand-100 transition-colors">Catalog</a>
                    <a href="#" class="hover:text-brand-100 transition-colors">My Tracker</a>
                    <a href="#" class="bg-brand-500 hover:bg-brand-700 px-4 py-2 rounded-md text-sm font-medium transition-colors">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        {% block content %}
        
        {% endblock content %}
    </main>

    <footer class="bg-black text-gray-300 py-6 text-center text-sm">
        <p>&copy; 2026 PBP E6</p>
    </footer>
</body>
</html>
